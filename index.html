<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>slidetime</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main id="stage" aria-live="polite">
    <div id="loading">Loading…</div>
  </main>

  <aside id="notes" hidden>
    <header>Speaker notes</header>
    <div id="notes-body"></div>
  </aside>

  <div id="hud">
    <div id="hud-left">
      <span id="slide-counter">0 / 0</span>
    </div>
    <div id="hud-center">
      <div id="slide-timer" class="timer" title="Slide time">
        <span class="label">slide</span>
        <span class="value">--:--</span>
      </div>
      <div id="total-timer" class="timer" title="Total session time">
        <span class="label">total</span>
        <span class="value">--:--</span>
      </div>
    </div>
    <div id="hud-right">
      <button id="btn-notes" type="button" title="Toggle speaker notes (S)">notes</button>
      <button id="btn-pause" type="button" title="Pause/resume timer (T)">pause</button>
      <button id="btn-fullscreen" type="button" title="Fullscreen (F)">⛶</button>
    </div>
  </div>

  <div id="progress"><div id="progress-bar"></div></div>

  <dialog id="help">
    <h2>Shortcuts</h2>
    <table>
      <tr><td>→ Space N PageDown</td><td>Next slide</td></tr>
      <tr><td>← P PageUp</td><td>Previous slide</td></tr>
      <tr><td>Home / End</td><td>First / last slide</td></tr>
      <tr><td>F</td><td>Fullscreen</td></tr>
      <tr><td>T</td><td>Pause / resume timer</td></tr>
      <tr><td>R</td><td>Reset slide timer</td></tr>
      <tr><td>S</td><td>Toggle speaker notes</td></tr>
      <tr><td>O</td><td>Overview grid</td></tr>
      <tr><td>?</td><td>This help</td></tr>
      <tr><td>Esc</td><td>Close overlay</td></tr>
    </table>
    <form method="dialog"><button>close</button></form>
  </dialog>

  <dialog id="overview">
    <header>Overview</header>
    <div id="overview-grid"></div>
    <form method="dialog"><button>close</button></form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="assets/presenter.js" defer></script>
</body>
</html>
